[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siftan"
version = "0.1.0a1"
description = "The Sieve Beneath the Stars (Siftan) | Benchmark contamination screening"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "siftan contributors" }]
keywords = ["llm", "benchmark", "contamination", "decontamination", "chinese", "基准污染"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
siftan = "siftan.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/cloudydreamland/TheSieveBeneathTheStars"
Repository = "https://github.com/cloudydreamland/TheSieveBeneathTheStars"
Issues = "https://github.com/cloudydreamland/TheSieveBeneathTheStars/issues"
Changelog = "https://github.com/cloudydreamland/TheSieveBeneathTheStars/blob/main/CHANGELOG.md"
Security = "https://github.com/cloudydreamland/TheSieveBeneathTheStars/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
